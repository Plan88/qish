[package]
name = "qish"
version = "0.1.0"
edition = "2024"
description = "Quick Interactive Shell Editor - A TUI command-line editor with fuzzy history search, tab completion, and syntax highlighting"
license = "MIT"
repository = "https://github.com/Plan88/qish"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
nucleo = "0.5.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.2"
thiserror = "2.0.18"
toml = "1.1.2"
tree-sitter = "0.26.8"
tree-sitter-bash = "0.25.1"
unicode-width = "0.2.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
