# qish keymap: Vim-style
# Place this file at ~/.config/qish/keymap.toml

[normal]
move_left = "h"
move_down = "j"
move_up = "k"
move_right = "l"
move_word_forward = "w"
move_word_back = "b"
move_line_start = "0"
move_line_end = "$"
insert_at_cursor = "i"
insert_after_cursor = "a"
insert_at_line_start = "I"
insert_at_line_end = "A"
delete_forward = "x"
undo = "u"
redo = "ctrl-r"
hover_info = "K"
search = "/"
accept = "enter"
abort = "ctrl-c"
clipboard_paste = "ctrl-v"
yank = "y"
yank_delete = "d"
paste_register = "p"
select_line = "V"
enter_visual = "v"

[visual]
extend_left = "h"
extend_down = "j"
extend_up = "k"
extend_right = "l"
extend_word_forward = "w"
extend_word_back = "b"
extend_line_start = "0"
extend_line_end = "$"
yank = "y"
yank_delete = "d"
enter_normal = "esc"
abort = "ctrl-c"

[insert]
complete_start = "tab"
delete_back = "backspace"
enter_normal = "esc"
insert_newline = "enter"
abort = "ctrl-c"
clipboard_paste = "ctrl-v"
delete_word_back = "ctrl-w"
delete_to_line_start = "ctrl-u"
undo = "ctrl-z"
redo = "ctrl-y"
